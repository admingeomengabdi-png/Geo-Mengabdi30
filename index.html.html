<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoCare - Earth & Environment Protection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, setDoc, getDoc, getDocs, onSnapshot, arrayUnion, arrayRemove, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZDZjIZsrtAkjukNhXaClUoPrl0cVyvW8",
            authDomain: "geo-mengabdi.firebaseapp.com",
            projectId: "geo-mengabdi",
            storageBucket: "geo-mengabdi.appspot.com",
            messagingSenderId: "713746496745",
            appId: "1:713746496745:web:d8723beee8c70d56fac478",
            measurementId: "G-N4CF0Z8N9D"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        
        const LOGO_LOCAL = "logo.jpg";

        window.currentUser = null;
        window.isAdmin = false;
        
        let mapInstance = null; 
        let trackChartInstance = null;
        let analisisChartInstance = null;
        let itemToDelete = null; 
        let currentChatPartnerUid = null;
        let chatUnsubscribe = null;
        let previousViewBeforeUser = 'view-beranda';
        let personalPostToDeleteId = null;
        let statusIntervalTimer = null;
        let selectedMusicTrack = null;
        let previewAudioElement = null;
        let selectedTaggedFriends = [];
        let allRegisteredUsers = [];
        let allMapMarkers = []; 

        const loginScreen = document.getElementById('login-screen');
        const splashScreen = document.getElementById('splash-screen');
        const mainApp = document.getElementById('main-app');
        const profileModal = document.getElementById('profile-modal');
        const usernameModal = document.getElementById('username-modal');
        const btnLogin = document.getElementById('btn-login');

        // FITUR BARU: LOGIKA LEVEL & BADGE
        window.getEcoBadge = (grams) => {
            const g = grams || 0;
            if(g >= 100000) return { name: "Eco-Champion", icon: "🏆", style: "bg-yellow-900/50 text-yellow-400 border border-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.5)]" };
            if(g >= 50000) return { name: "Eco-Master", icon: "💎", style: "bg-cyan-900/50 text-cyan-400 border border-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.5)]" };
            if(g >= 20000) return { name: "Eco-Guardian", icon: "🛡️", style: "bg-purple-900/50 text-purple-400 border border-purple-400 shadow-[0_0_10px_rgba(192,132,252,0.5)]" };
            if(g >= 10000) return { name: "Eco-Ranger", icon: "⚔️", style: "bg-red-900/50 text-red-400 border border-red-400 shadow-[0_0_10px_rgba(248,113,113,0.5)]" };
            if(g >= 1000) return { name: "Eco-Novice", icon: "🌱", style: "bg-emerald-900/50 text-emerald-400 border border-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.5)]" };
            return { name: "Warga Pemula", icon: "👤", style: "bg-gray-800 text-gray-300 border border-gray-600" };
        };

        btnLogin.addEventListener('click', () => {
            signInWithPopup(auth, provider).then(() => {
                showLoginSuccessAnimationModal();
            }).catch((error) => {
                showNotificationModal("Gagal Login", error.message, false);
            });
        });

        window.logout = () => {
            signOut(auth).then(() => {
                localStorage.removeItem('saved_user_uid');
                location.reload();
            });
        };

        onAuthStateChanged(auth, async (user) => {
            try {
                if (user) {
                    window.currentUser = user;
                    window.isAdmin = (user.email === 'admingeomengabdi@gmail.com');
                    
                    const userDocRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userDocRef);

                    if (userSnap.exists()) {
                        const uData = userSnap.data();
                        if (uData.statusBlokir && uData.statusBlokir !== 'aktif') {
                            checkBannedStatus(uData);
                            return;
                        }
                    }

                    loginScreen.classList.add('hidden');
                    localStorage.setItem('saved_user_uid', user.uid);
                    
                    fetchAllUsersForTagging();
                    loadHomeFeedAndStories();

                    if (window.isAdmin) {
                        showSplashThenMainApp();
                    } else {
                        if (!userSnap.exists() || !userSnap.data().username) {
                            usernameModal.classList.remove('hidden');
                        } else if (!localStorage.getItem('profileComplete_' + user.uid)) {
                            profileModal.classList.remove('hidden');
                            document.getElementById('prof-email').value = user.email;
                        } else {
                            showSplashThenMainApp();
                        }
                    }
                } else {
                    const savedUid = localStorage.getItem('saved_user_uid');
                    if (!savedUid) {
                        loginScreen.classList.remove('hidden');
                        mainApp.classList.add('hidden');
                        splashScreen.classList.add('hidden');
                    }
                }
            } catch (err) {
                console.error("Auth state error:", err);
            }
        });

        function showLoginSuccessAnimationModal() {
            const modal = document.getElementById('notification-modal');
            if(!modal) return;
            modal.innerHTML = `
                <div class="glass-panel rounded-3xl w-full max-w-sm p-8 text-center transform transition-all duration-300 animate-scale-up neon-border">
                    <div class="mb-4">
                        <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-4xl mx-auto neon-border animate-bounce">🎉</div>
                    </div>
                    <h3 class="text-2xl font-extrabold text-white mb-2 neon-text">Login Berhasil!</h3>
                    <p class="text-emerald-200 text-sm mb-6">Selamat datang kembali di ekosistem GeoCare.</p>
                    <button onclick="closeLoginSuccessModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.5)] transition duration-200 transform active:scale-95">Lanjutkan</button>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        window.closeLoginSuccessModal = () => {
            document.getElementById('notification-modal').classList.add('hidden');
        };

        function showSplashThenMainApp() {
            loginScreen.classList.add('hidden');
            splashScreen.classList.remove('hidden');
        }

        window.startAppFromSplash = () => {
            splashScreen.classList.add('hidden');
            showMainApp();
        };

        async function fetchAllUsersForTagging() {
            try {
                const snap = await getDocs(collection(db, "users"));
                allRegisteredUsers = [];
                snap.forEach(d => {
                    const data = d.data();
                    if (window.currentUser && data.uid !== window.currentUser.uid && data.email !== 'admingeomengabdi@gmail.com') {
                        allRegisteredUsers.push(data);
                    }
                });
            } catch(e) {
                console.error("Gagal memuat pengguna untuk tag:", e);
            }
        }

        function checkBannedStatus(uData) {
            loginScreen.classList.add('hidden');
            mainApp.classList.add('hidden');
            splashScreen.classList.add('hidden');
            const bannedModal = document.getElementById('banned-modal');
            const bannedText = document.getElementById('banned-reason-text');
            
            if (uData.statusBlokir === 'permanen') {
                bannedText.innerText = "Akun Anda telah diblokir secara PERMANEN oleh Administrator.";
            } else if (uData.statusBlokir === 'sementara') {
                const tanggalBuka = new Date(uData.tanggalBukaBlokir);
                bannedText.innerText = `Akun Anda diblokir sementara hingga ${tanggalBuka.toLocaleDateString('id-ID')}.`;
            }
            bannedModal.classList.remove('hidden');
        }

        window.saveUsername = async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('input-username').value.trim().toLowerCase();
            const warningEl = document.getElementById('username-warning');
            if (!usernameInput || !window.currentUser) return;

            const q = query(collection(db, "users"), where("username", "==", usernameInput));
            const querySnapshot = await getDocs(q);
            let isDuplicate = false;
            querySnapshot.forEach((doc) => { if (doc.id !== window.currentUser.uid) isDuplicate = true; });

            if (isDuplicate) {
                warningEl.classList.remove('hidden');
                return;
            } else {
                warningEl.classList.add('hidden');
            }

            try {
                await setDoc(doc(db, "users", window.currentUser.uid), {
                    uid: window.currentUser.uid,
                    email: window.currentUser.email,
                    nama: window.currentUser.displayName || "Warga",
                    username: usernameInput,
                    biodata: "Warga pemerhati lingkungan GeoCare.",
                    fotoProfil: window.currentUser.photoURL || LOGO_LOCAL,
                    followers: [],
                    following: [],
                    followRequests: [],
                    isPrivate: false,
                    statusBlokir: 'aktif',
                    statusAktifHingga: 0,
                    totalPartisipasi: 0 // Default gram
                }, { merge: true });

                usernameModal.classList.add('hidden');
                profileModal.classList.remove('hidden');
                document.getElementById('prof-email').value = window.currentUser.email;
            } catch (err) {
                alert("Gagal menyimpan username: " + err.message);
            }
        };

        window.saveProfile = async (e) => {
            e.preventDefault();
            if (!window.currentUser) return;
            
            const telepon = document.getElementById('prof-telepon').value.trim();
            const alamat = document.getElementById('prof-alamat').value.trim();
            const ttl = document.getElementById('prof-ttl').value.trim();

            const phoneRegex = /^[0-9]{10,15}$/;
            if (!phoneRegex.test(telepon)) {
                showNotificationModal("Validasi Gagal", "Nomor telepon harus berupa angka yang valid (10-15 digit tanpa huruf atau spasi berlebih).", false);
                return;
            }
            if (alamat.length < 10) {
                showNotificationModal("Validasi Gagal", "Alamat terlalu singkat. Mohon masukkan alamat lengkap minimal 10 karakter.", false);
                return;
            }
            if (ttl.length < 5 || !ttl.includes(',')) {
                showNotificationModal("Validasi Gagal", "Format Tempat, Tanggal Lahir tidak valid. Contoh: Balikpapan, 12 Januari 2004", false);
                return;
            }

            try {
                await updateDoc(doc(db, "users", window.currentUser.uid), { telepon, alamat, ttl, statusBlokir: 'aktif' });
                localStorage.setItem('profileComplete_' + window.currentUser.uid, 'true');
                profileModal.classList.add('hidden');
                showSplashThenMainApp();
            } catch(err) {
                alert("Gagal menyimpan profil: " + err.message);
            }
        };

        function showMainApp() {
            mainApp.classList.remove('hidden');
            const nameDisplay = document.getElementById('user-name-display');
            if(nameDisplay) nameDisplay.innerText = window.isAdmin ? "Admin GeoCare" : window.currentUser?.displayName || "Warga";
            
            document.querySelectorAll('.admin-only').forEach(el => {
                el.style.display = window.isAdmin ? 'inline-block' : 'none';
            });

            loadInformasi();
            loadMap();
            loadEdukasi();
            loadTrackRecordData();
            loadMyProfileData();
            loadNotificationsAndMessages();
            loadHomeFeedAndStories();
            if (window.isAdmin) loadAdminUserList();
            
            switchView('view-beranda', 'Beranda Utama');
        }

        window.openCustomerServiceAdmin = async () => {
            if (!window.currentUser) return;
            const q = query(collection(db, "users"), where("email", "==", "admingeomengabdi@gmail.com"));
            const snap = await getDocs(q);
            let adminUid = "";
            snap.forEach(d => { adminUid = d.id; });

            if (!adminUid) {
                showNotificationModal("Info", "Akun Customer Service Admin belum terdaftar di database.", false);
                return;
            }
            openChatRoom(adminUid, "Customer Service Admin", LOGO_LOCAL);
        };

        // ... FUNGSI BAWAAN POSTINGAN, STATUS, FEED (Tetap sama, disesuaikan tampilannya secara otomatis melalui CSS) ...
        function loadHomeFeedAndStories() {
            if (!window.currentUser) return;
            
            onSnapshot(collection(db, "users"), (snapshot) => {
                const storiesContainer = document.getElementById('home-stories-container');
                if (!storiesContainer) return;
                
                let storiesHtml = `
                    <div onclick="openStatusViewer('${window.currentUser.uid}', true)" class="flex flex-col items-center cursor-pointer flex-shrink-0 transition transform hover:scale-105 duration-200">
                        <div class="w-16 h-16 rounded-full p-0.5 border-2 border-dashed border-emerald-500 flex items-center justify-center glass-panel relative">
                            <img src="${window.currentUser.photoURL || LOGO_LOCAL}" class="w-full h-full rounded-full object-cover">
                            <div class="absolute bottom-0 right-0 bg-emerald-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold">+</div>
                        </div>
                        <span class="text-xs mt-1 truncate w-16 text-center font-medium">Cerita Anda</span>
                    </div>
                `;

                snapshot.forEach(docSnap => {
                    const uData = docSnap.data();
                    if (uData.uid !== window.currentUser.uid && uData.email !== 'admingeomengabdi@gmail.com') {
                        const now = Date.now();
                        const hasActiveStatus = uData.statusAktifHingga && uData.statusAktifHingga > now;
                        const ringClass = hasActiveStatus ? "ring-4 ring-emerald-500 ring-offset-2 ring-offset-black" : "border border-gray-600";

                        storiesHtml += `
                            <div onclick="openStatusViewer('${uData.uid}', false)" class="flex flex-col items-center cursor-pointer flex-shrink-0 transition transform hover:scale-105 duration-200">
                                <div class="w-16 h-16 rounded-full p-0.5 ${ringClass} glass-panel">
                                    <img src="${uData.fotoProfil || LOGO_LOCAL}" class="w-full h-full rounded-full object-cover">
                                </div>
                                <span class="text-xs mt-1 truncate w-16 text-center font-medium">${uData.nama}</span>
                            </div>
                        `;
                    }
                });
                storiesContainer.innerHTML = storiesHtml;
            });

            onSnapshot(collection(db, "postingan_pribadi"), async (snapshot) => {
                const feedContainer = document.getElementById('home-feed-container');
                if (!feedContainer) return;
                
                let posts = [];
                snapshot.forEach(d => posts.push({ id: d.id, ...d.data() }));
                posts.sort((a,b) => b.timestamp - a.timestamp);

                if (posts.length === 0) {
                    feedContainer.innerHTML = `<p class="text-xs text-gray-400 italic text-center py-6">Belum ada postingan dari warga.</p>`;
                    return;
                }

                let feedHtml = "";
                for (const post of posts) {
                    const uSnap = await getDoc(doc(db, "users", post.uid));
                    const uData = uSnap.exists() ? uSnap.data() : { nama: "Warga", fotoProfil: LOGO_LOCAL, username: "warga" };
                    const isLiked = window.currentUser && post.likes.includes(window.currentUser.uid);
                    
                    // Template postingan menggunakan class glass-panel
                    feedHtml += `
                        <div class="glass-panel rounded-3xl mb-6 overflow-hidden text-left transition duration-200 hover:shadow-[0_0_15px_rgba(16,185,129,0.2)]">
                            <div class="flex items-center justify-between p-4 pb-3">
                                <div class="flex items-center gap-3 cursor-pointer" onclick="openUserProfile('${post.uid}')">
                                    <img src="${uData.fotoProfil}" class="w-10 h-10 rounded-full object-cover border border-emerald-500">
                                    <div>
                                        <div class="flex items-center"><h4 class="font-bold text-sm text-white">${uData.nama}</h4></div>
                                        <span class="text-[10px] text-emerald-400">@${uData.username || 'warga'} • ${new Date(post.timestamp).toLocaleDateString('id-ID')}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="px-4 pb-2"><p class="text-sm text-gray-200">${post.konten}</p></div>
                            ${post.mediaUrl ? `<div class="px-4"><img src="${post.mediaUrl}" class="w-full h-auto max-h-96 rounded-xl mt-3 object-cover border border-gray-700"></div>` : ""}
                            <div class="p-4 pt-3">
                                <div class="flex items-center justify-between text-sm pt-2 border-t border-gray-700/50">
                                    <div class="flex gap-4 items-center">
                                        <button onclick="togglePersonalPostLike('${post.id}', ${isLiked})" class="${isLiked ? 'text-red-500' : 'text-gray-400 hover:text-emerald-400'} font-bold flex items-center gap-1 transition transform active:scale-125 duration-150">❤️ ${post.likes.length}</button>
                                    </div>
                                    <button class="text-gray-400 hover:text-emerald-400 font-semibold text-xs">🔗 Bagikan</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                feedContainer.innerHTML = feedHtml;
            });
        }

        window.togglePersonalPostLike = async (postId, isCurrentlyLiked) => {
            if (!window.currentUser) return;
            const ref = doc(db, "postingan_pribadi", postId);
            if(isCurrentlyLiked) await updateDoc(ref, { likes: arrayRemove(window.currentUser.uid) });
            else await updateDoc(ref, { likes: arrayUnion(window.currentUser.uid) });
        };

        // FUNGSI LOAD MY PROFILE DATA
        function loadMyProfileData() {
            if (window.isAdmin || !window.currentUser) return;
            onSnapshot(doc(db, "users", window.currentUser.uid), async (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('my-profile-name').innerText = data.nama;
                    document.getElementById('my-profile-username').innerText = "@" + (data.username || "-");
                    document.getElementById('my-profile-bio').innerText = data.biodata || "Belum ada biodata.";
                    
                    const imgEl = document.getElementById('my-profile-img');
                    imgEl.src = data.fotoProfil || LOGO_LOCAL;
                    
                    const followersList = data.followers || [];
                    const followingList = data.following || [];
                    const totalGram = data.totalPartisipasi || 0;
                    
                    document.getElementById('count-followers').innerText = followersList.length;
                    document.getElementById('count-following').innerText = followingList.length;
                    document.getElementById('my-total-gram').innerText = totalGram.toLocaleString('id-ID');

                    // Set Eco Badge
                    const badge = getEcoBadge(totalGram);
                    document.getElementById('my-eco-badge').innerHTML = `
                        <span class="${badge.style} px-3 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1">
                            ${badge.icon} Level: ${badge.name}
                        </span>
                    `;

                    document.getElementById('edit-bio').value = data.biodata || "";
                }
            });
        }

        window.openUserProfile = async (targetUid) => {
            if (!window.currentUser) return;
            switchView('view-user-profile', 'Profil Warga');
            const targetSnap = await getDoc(doc(db, "users", targetUid));
            if (!targetSnap.exists()) return;

            const tData = targetSnap.data();
            document.getElementById('other-profile-img').src = tData.fotoProfil || LOGO_LOCAL;
            document.getElementById('other-profile-name').innerText = tData.nama;
            document.getElementById('other-profile-username').innerText = "@" + (tData.username || "-");
            document.getElementById('other-profile-bio').innerText = tData.biodata || "Belum ada biodata.";

            const totalGram = tData.totalPartisipasi || 0;
            document.getElementById('other-count-followers').innerText = (tData.followers || []).length;
            document.getElementById('other-count-following').innerText = (tData.following || []).length;
            document.getElementById('other-total-gram').innerText = totalGram.toLocaleString('id-ID');

            const badge = getEcoBadge(totalGram);
            document.getElementById('other-eco-badge').innerHTML = `
                <span class="${badge.style} px-3 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1">
                    ${badge.icon} Level: ${badge.name}
                </span>
            `;
            
            // Konfigurasi Follow dan UI disembunyikan untuk simplicity (bisa diaktifkan sesuai kode awal)
        };

        // FUNGSI ADMIN: INPUT GRAM SAMPAH
        window.submitPartisipasiAdmin = async () => {
            const targetUid = document.getElementById('admin-input-uid').value.trim();
            const grams = parseInt(document.getElementById('admin-input-gram').value);
            
            if (!targetUid || isNaN(grams) || grams <= 0) {
                showNotificationModal("Input Gagal", "Pastikan UID dan jumlah gram valid.", false);
                return;
            }

            try {
                // 1. Simpan ke riwayat untuk kalkulasi Leaderboard
                await addDoc(collection(db, "riwayat_partisipasi"), {
                    uid: targetUid,
                    gram: grams,
                    timestamp: Date.now()
                });

                // 2. Update total partisipasi di profil user
                const userRef = doc(db, "users", targetUid);
                const userSnap = await getDoc(userRef);
                
                let totalSekarang = 0;
                if(userSnap.exists() && userSnap.data().totalPartisipasi) {
                    totalSekarang = userSnap.data().totalPartisipasi;
                }

                await updateDoc(userRef, { 
                    totalPartisipasi: totalSekarang + grams 
                });

                document.getElementById('admin-input-uid').value = "";
                document.getElementById('admin-input-gram').value = "";
                showNotificationModal("Sukses", `Berhasil menambahkan ${grams} gram untuk warga tersebut.`, true);
            } catch (err) {
                showNotificationModal("Error", err.message, false);
            }
        };

        // FUNGSI SISTEM: LEADERBOARD MINGGUAN (7 HARI)
        window.loadLeaderboardMingguan = async () => {
            const container = document.getElementById('leaderboard-container');
            if(!container) return;
            container.innerHTML = `<p class="text-center text-emerald-500 animate-pulse">Menghitung data warga aktif...</p>`;

            const tujuhHariLalu = Date.now() - (7 * 24 * 60 * 60 * 1000);
            
            const q = query(collection(db, "riwayat_partisipasi"), where("timestamp", ">=", tujuhHariLalu));
            const snap = await getDocs(q);
            
            let rankingMap = {};
            snap.forEach(doc => {
                const data = doc.data();
                if(!rankingMap[data.uid]) rankingMap[data.uid] = 0;
                rankingMap[data.uid] += data.gram;
            });

            const sortedRanking = Object.entries(rankingMap).sort((a, b) => b[1] - a[1]);

            if(sortedRanking.length === 0) {
                container.innerHTML = `<div class="glass-panel p-6 text-center text-gray-400 rounded-2xl">Belum ada penyetoran dalam 7 hari terakhir. Ayo jadi yang pertama!</div>`;
                return;
            }

            let html = "";
            for (let i = 0; i < sortedRanking.length; i++) {
                const [uid, totalGram] = sortedRanking[i];
                const userSnap = await getDoc(doc(db, "users", uid));
                const uData = userSnap.exists() ? userSnap.data() : { nama: "Warga", username: "anonim", fotoProfil: LOGO_LOCAL };
                
                let rankBadge = `<span class="font-bold text-gray-500 text-lg">#${i+1}</span>`;
                if(i === 0) rankBadge = `<span class="text-3xl filter drop-shadow-[0_0_10px_rgba(250,204,21,0.8)]">🥇</span>`;
                if(i === 1) rankBadge = `<span class="text-3xl filter drop-shadow-[0_0_10px_rgba(156,163,175,0.8)]">🥈</span>`;
                if(i === 2) rankBadge = `<span class="text-3xl filter drop-shadow-[0_0_10px_rgba(180,83,9,0.8)]">🥉</span>`;

                html += `
                    <div class="glass-panel flex items-center justify-between p-4 rounded-2xl mb-3 transition transform hover:scale-[1.02] hover:border-emerald-500/50">
                        <div class="flex items-center gap-4 cursor-pointer" onclick="openUserProfile('${uid}')">
                            <div class="w-10 text-center">${rankBadge}</div>
                            <img src="${uData.fotoProfil}" class="w-12 h-12 rounded-full object-cover border-2 border-emerald-500/50 shadow-[0_0_10px_rgba(16,185,129,0.3)]">
                            <div>
                                <h4 class="font-bold text-white">${uData.nama}</h4>

        window.switchView = (viewId, title) => {
            const activeViewEl = document.querySelector('.app-view:not(.hidden)');
            if (activeViewEl && activeViewEl.id !== 'view-user-profile' && viewId !== 'view-user-profile') {
                previousViewBeforeUser = activeViewEl.id;
            }

            document.querySelectorAll('.app-view').forEach(el => el.classList.add('hidden'));
            const targetView = document.getElementById(viewId);
            if(targetView) targetView.classList.remove('hidden');
            
            const pageTitle = document.getElementById('page-title');
            if(pageTitle) pageTitle.innerText = title;

            const hamburgerBtn = document.getElementById('btn-hamburger');
            const backBtn = document.getElementById('btn-back');

            if (viewId === 'view-beranda') {
                if(hamburgerBtn) hamburgerBtn.classList.remove('hidden');
                if(backBtn) backBtn.classList.add('hidden');
            } else {
                if(hamburgerBtn) hamburgerBtn.classList.add('hidden');
                if(backBtn) backBtn.classList.remove('hidden');
            }

            // Trigger Khusus
            if(viewId === 'view-leaderboard') loadLeaderboardMingguan();
            if(viewId === 'view-analisis') loadAnalisisData();

            if(viewId === 'view-peta' && mapInstance) {
                setTimeout(() => mapInstance.invalidateSize(), 100);
            }
            toggleSidebarMobile(false);
        };

        window.toggleSidebarMobile = (forceState) => {
            const sidebar = document.getElementById('sidebar-menu');

            if (typeof forceState === 'boolean') {
                if (forceState) sidebar.classList.remove('-translate-x-full');
                else sidebar.classList.add('-translate-x-full');
            } else {
                sidebar.classList.toggle('-translate-x-full');
            }
        };

        window.toggleNightMode = () => {
            const body = document.body;
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('night_mode', isDark);
            
            const btnText = document.getElementById('night-mode-text');
            if(btnText) btnText.innerText = isDark ? "☀️ Light Mode" : "🌙 Night Mode";
        };

        window.loadNightModePref = () => {

            onSnapshot(collection(db, "users"), (snapshot) => {
                const container = document.getElementById('admin-user-list-container');
                if (!container) return;
                container.innerHTML = "";

                    <div class="mb-4"><div class="w-16 h-16 ${isSuccess ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500' : 'bg-red-500/20 text-red-400 border-red-500'} border rounded-full flex items-center justify-center text-3xl mx-auto shadow-[0_0_15px_currentColor]">${isSuccess ? '🎉' : '⚠️'}</div></div>
                    <h3 class="text-2xl font-bold text-white mb-2">${title}</h3>
                    <p class="text-gray-300 text-sm mb-6">${message}</p>
                    <button onclick="closeNotificationModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.5)] transition duration-150 active:scale-95">Mengerti</button>
                </div>
            `;
            modal.classList.remove('hidden');
        };

        window.closeNotificationModal = () => { document.getElementById('notification-modal').classList.add('hidden'); };
